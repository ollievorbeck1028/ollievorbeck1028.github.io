<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliver Vorbeck | Portfolio</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    #matrix-bg {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: #111;
    }
    .content {
      position: relative;
      z-index: 2;
    }
    header {
      background: rgba(17,17,17,0.85);
      padding: 32px 0 18px 0;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #00ff41;
      text-shadow: 0 0 10px #00ff41;
    }
    nav {
      margin-top: 10px;
    }
    nav a {
      color: #00ff41;
      text-decoration: none;
      margin: 0 16px;
      font-size: 1.1rem;
      font-weight: 500;
      transition: color 0.2s;
      text-shadow: 0 0 5px #00ff41;
    }
    nav a:hover {
      color: #fff;
    }
    .portfolio-section {
      max-width: 900px;
      margin: 44px auto 50px auto;
      padding: 0 20px;
      background: rgba(17,17,17,0.85);
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,255,65,.12);
      border: 1px solid #00ff41;
    }
    .portfolio-section h2 {
      text-align: center;
      font-size: 2rem;
      font-weight: 500;
      color: #00ff41;
      text-shadow: 0 0 5px #00ff41;
      margin-top: 20px;
      margin-bottom: 20px;
    }
    .project-list {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }
    .project-link {
      background: rgba(17,17,17,0.85);
      border-radius: 9px;
      box-shadow: 0 2px 10px rgba(0,255,65,.12);
      overflow: hidden;
      width: 270px;
      text-align: center;
      transition: box-shadow 0.2s;
      border: 1px solid #00ff41;
      display: block;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      position: relative;
    }
    .project-link:hover {
      box-shadow: 0 6px 16px rgba(0,255,65,.18);
      border-color: #fff;
    }
    .project-link img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .project-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 15px 0 12px 0;
      color: #00ff41;
      text-shadow: 0 0 4px #00ff41;
    }
    .project-desc {
      font-size: 0.98rem;
      color: #eee;
      margin-bottom: 16px;
      padding: 0 12px;
      text-shadow: 0 0 7px #111;
    }
    @media (max-width: 600px) {
      .project-list { flex-direction: column; gap: 16px; }
      .project-link { width: 100%; }
      .portfolio-section { padding: 0 8px; }
    }
  </style>
</head>
<body>
  <canvas id="matrix-bg"></canvas>
  <div class="content">
    <header>
      <h1>Oliver Vorbeck</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="image.html">Images</a>
        <a href="portfolio.html">Portfolio</a>
      </nav>
    </header>
    <section class="portfolio-section">
      <h2>Portfolio</h2>
      <div class="project-list">
        <a href="fsd-projects/platformer/" target="_blank" class="project-link">
          <img src="https://placehold.co/270x160?text=Platformer" alt="Platformer Project"/>
          <div class="project-title">Platformer</div>
          <div class="project-desc">A cannon-dodging adventure game for Halleb0t.</div>
        </a>
        <a href="fsd-projects/bouncing-box/" target="_blank" class="project-link">
          <img src="https://placehold.co/270x160?text=Bouncing+Box" alt="Bouncing Box Project"/>
          <div class="project-title">Bouncing Box</div>
          <div class="project-desc">A fun introduction to web game development.</div>
        </a>
        <a href="fsd-projects/circularity/" target="_blank" class="project-link">
          <img src="https://placehold.co/270x160?text=Circularity" alt="Circularity Project"/>
          <div class="project-title">Circularity</div>
          <div class="project-desc">A poetic motion experiment with circles.</div>
        </a>
        <!-- Add more projects as needed, using this clickable pattern -->
      </div>
    </section>
  </div>
  <script>
  // Matrix Falling Code Background Script
  const canvas = document.getElementById('matrix-bg');
  const ctx = canvas.getContext('2d');
  let width = window.innerWidth;
  let height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;

  const fontSize = 18;
  const columns = Math.floor(width / fontSize);
  const chars = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズヅブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const drops = Array(columns).fill(1);

  function drawMatrix() {
    ctx.fillStyle = "rgba(17, 17, 17, 0.6)";
    ctx.fillRect(0, 0, width, height);

    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = "#00ff41";
      ctx.shadowColor = "#00ff41";
      ctx.shadowBlur = 8;
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
    ctx.shadowBlur = 0;
  }

  let matrixAnim = setInterval(drawMatrix, 50);

  window.addEventListener('resize', () => {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  });
  </script>
</body>
</html>
