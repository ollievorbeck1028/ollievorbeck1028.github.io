<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliver Vorbeck | Home</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    #matrix-bg {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: #111;
    }
    .content { position: relative; z-index: 2; }
    header {
      background: rgba(17,17,17,0.85);
      padding: 32px 0 18px 0;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #00ff41;
      text-shadow: 0 0 10px #00ff41;
    }
    nav { margin-top: 10px; }
    nav a {
      color: #00ff41;
      text-decoration: none;
      margin: 0 16px;
      font-size: 1.1rem;
      font-weight: 500;
      transition: color 0.2s;
      text-shadow: 0 0 5px #00ff41;
    }
    nav a:hover { color: #fff; }
    .about {
      text-align: center;
      margin: 44px 0 30px 0;
    }
    .about h2 {
      font-size: 1.7rem;
      font-weight: 500;
      margin-bottom: 10px;
      color: #00ff41;
      text-shadow: 0 0 5px #00ff41;
    }
    .about p {
      font-size: 1.15rem;
      color: #fff;
      text-shadow: 0 0 7px #111;
    }
    .projects {
      max-width: 900px;
      margin: 0 auto 50px auto;
      padding: 0 20px;
    }
    .projects h2 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 20px;
      text-align: center;
      color: #00ff41;
      text-shadow: 0 0 5px #00ff41;
    }
    .project-list {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }
    .project-link {
      background: rgba(17,17,17,0.85);
      border-radius: 9px;
      box-shadow: 0 2px 10px rgba(0,255,65,.12);
      overflow: hidden;
      width: 270px;
      text-align: center;
      transition: box-shadow 0.2s;
      border: 1px solid #00ff41;
      display: block;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      position: relative;
    }
    .project-link:hover {
      box-shadow: 0 6px 16px rgba(0,255,65,.18);
      border-color: #fff;
    }
    .project-link img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .project-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 15px 0 12px 0;
      color: #00ff41;
      text-shadow: 0 0 4px #00ff41;
    }
    .project-desc {
      font-size: 0.98rem;
      color: #eee;
      margin-bottom: 16px;
      padding: 0 12px;
      text-shadow: 0 0 7px #111;
    }
    @media (max-width: 600px) {
      .project-list { flex-direction: column; gap: 16px; }
      .project-link { width: 100%; }
    }
  </style>
</head>

  <script>
  // Matrix Falling Code Background Script
  const canvas = document.getElementById('matrix-bg');
  const ctx = canvas.getContext('2d');
  let width = window.innerWidth;
  let height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;

  const fontSize = 18;
  const columns = Math.floor(width / fontSize);
  const chars = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズヅブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const drops = Array(columns).fill(1);

  function drawMatrix() {
    ctx.fillStyle = "rgba(17, 17, 17, 0.6)";
    ctx.fillRect(0, 0, width, height);

    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = "#00ff41";
      ctx.shadowColor = "#00ff41";
      ctx.shadowBlur = 8;
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
    ctx.shadowBlur = 0;
  }

  let matrixAnim = setInterval(drawMatrix, 50);

  window.addEventListener('resize', () => {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  });
  </script>
