<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Platformer Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <link href="platformer.css" rel="stylesheet" />



  


  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    #matrix-bg {
      position: fixed;
      top: 0; left: 0;
      z-index: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      background: #111;
    }
    .content {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 50px;
    }
    header {
      background: rgba(17,17,17,0.85);
      padding: 32px 0 18px 0;
      text-align: center;
      border-radius: 0 0 18px 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px #00ff4133;
    }
    header h1 {
      margin: 0;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #00ff41;
      text-shadow: 0 0 10px #00ff41;
    }
    nav {
      margin-top: 10px;
    }
    nav a {
      color: #00ff41;
      text-decoration: none;
      margin: 0 16px;
      font-size: 1.1rem;
      font-weight: 500;
      transition: color 0.2s;
      text-shadow: 0 0 5px #00ff41;
    }
    nav a:hover {
      color: #fff;
    }
    .game-container {
      background: rgba(17,17,17,0.93);
      border-radius: 14px;
      border: 2px solid #00ff41;
      box-shadow: 0 2px 18px #00ff4130;
      margin: 0 auto 40px auto;
      padding: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      max-width: 1100px;
    }
    .game-title {
      font-size: 2rem;
      color: #00ff41;
      font-weight: 600;
      margin-bottom: 18px;
      text-shadow: 0 0 6px #00ff41;
    }
    #canvas {
      display: block;
      margin: 0 auto;
      border-radius: 8px;
      border: 2.5px solid #00ff41;
      box-shadow: 0 0 24px #00ff41, 0 2px 8px #111;
      background: #222;
      width: 100%;
      max-width: 1000px;
      height: auto;
    }
    .instructions {
      margin: 24px auto 0 auto;
      font-size: 1.15rem;
      color: #caffff;
      text-shadow: 0 0 4px #00ff41;
      background: rgba(0,255,65,0.08);
      padding: 12px 24px;
      border-radius: 8px;
      max-width: 700px;
    }
    @media (max-width: 900px) {
      .content {padding-top: 15px;}
      .game-container {padding: 8px;}
      #canvas {max-width: 98vw;}
      .instructions {padding: 6px 8px;}
    }

  </style>
  <script src="https://code.jquery.com/jquery-3.1.0.js"></script>
  <script src="setup.js"></script>
  <script src="helpers.js"></script>
  <script src="platformer.js"></script>
</head>
<body>
  <canvas id="matrix-bg"></canvas>
  <div class="content">
    <header>
      <h1>Platformer Game</h1>
      <nav>
        <a href="../../index.html">Home</a>
        <a href="../../portfolio.html">Portfolio</a>
        <a href="../../image.html">Images</a>
      </nav>
    </header>
    <section class="game-container">
      <div class="game-title">Halleb0t Cannon Dodge</div>
      <canvas id="canvas" width="1400" height="750"></canvas>
      <img id="cannon" src="images/cannon.png" style="display:none;" />
      <img id="player" src="images/halle.png" style="display:none;" />
      <img id="projectile" src="https://static.vecteezy.com/system/resources/previews/013/362/728/non_2x/beach-ball-transparent-free-png.png" style="display:none;" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/bd/Test.svg" style="display:none;" />
      <div class="instructions">
        <strong>Instructions:</strong> Use your keyboard to move, dodge, and jump!
        <br>
        Avoid the cannonballs and survive as long as you can.
        <br>
        <span style="color:#fffc00;">Tip:</span> You can adjust the platformer.js code for more features!
      </div>
    </section>
  </div>
  <script>
  // Matrix Falling Code Background Script
  const canvasBg = document.getElementById('matrix-bg');
  const ctx = canvasBg.getContext('2d');
  let width = window.innerWidth;
  let height = window.innerHeight;
  canvasBg.width = width;
  canvasBg.height = height;
  const fontSize = 18;
  const columns = Math.floor(width / fontSize);
  const chars = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズヅブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const drops = Array(columns).fill(1);
  function drawMatrix() {
    ctx.fillStyle = "rgba(17, 17, 17, 0.6)";
    ctx.fillRect(0, 0, width, height);
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = "#00ff41";
      ctx.shadowColor = "#00ff41";
      ctx.shadowBlur = 8;
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
    ctx.shadowBlur = 0;
  }
  let matrixAnim = setInterval(drawMatrix, 50);
  window.addEventListener('resize', () => {
    width = window.innerWidth;
    height = window.innerHeight;
    canvasBg.width = width;
    canvasBg.height = height;
  });
  </script>
</body>
</html>
