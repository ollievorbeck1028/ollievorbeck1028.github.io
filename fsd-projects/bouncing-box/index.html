    .scoreboard.glow {

    }
    .box {
      width: 90px;

      background: linear-gradient(135deg,#00ff41 0%, #222 100%);

    #game-root.red-flash {

      background: linear-gradient(rgba(255,0,0,0.45),rgba(255,0,0,0.25)), #181f1a;
    }
    #game-root.flashbang {
      background: #fff !important;

  }
}

    }

      display: none;

      0% { background: linear-gradient(rgba(255,0,0,0.45),rgba(255,0,0,0.25)), #181f1a; }

    }
    @media (max-width: 700px) {

<body>
  <canvas id="matrix-bg"></canvas>
  <div class="content">
    <header>
      <h1>Bouncing Box</h1>
      <nav>
        <a href="../../index.html">Home</a>
        <a href="../../portfolio.html">Portfolio</a>

    <section class="about">
      <h2>About This Game</h2>

        A fun introduction to web game development.<br>
        Click the box to score points and speed it up!
      </p>
    </section>
    <section class="game-container">
      <div class="game-title">Play Bouncing Box</div>
      <div id="game-root">
        <div id="flashbang-text">Flashbang Out</div>
      </div>

      <!-- Flashbang sound -->

  <!-- Matrix Falling Code Background Script -->
  <script>
  const canvas = document.getElementById('matrix-bg');
  const ctx = canvas.getContext('2d');
  let width = window.innerWidth;
  let height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  const fontSize = 18;
  const columns = Math.floor(width / fontSize);
  const chars = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズヅブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const drops = Array(columns).fill(1);
  function drawMatrix() {
    ctx.fillStyle = "rgba(17, 17, 17, 0.6)";
    ctx.fillRect(0, 0, width, height);
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = "#00ff41";
      ctx.shadowColor = "#00ff41";
      ctx.shadowBlur = 8;
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
    ctx.shadowBlur = 0;
  }
  let matrixAnim = setInterval(drawMatrix, 50);
  window.addEventListener('resize', () => {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  });
  </script>
  <!-- The actual game logic and box -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script>
    $(function() {
      var $root = $("#game-root");
      var flashbangAudio = $("#flashbang-audio")[0];
      var missCount = 0;
      $root.html('<div class="box" tabindex="0">?</div><div id="flashbang-text">FLASHBANG</div>');
      var box = $root.find('.box');
      var scoreboard = $("#scoreboard");
      var flashbangText = $("#flashbang-text");
      function getBoardSize() {
        return {
          width: $root.width(),
          height: $root.height()
        };
      }
      var size = getBoardSize();
      var boardWidth = size.width;
      var boardHeight = size.height;
      var boxW = box.width();
      var boxH = box.height();
      var positionX = (boardWidth-boxW)/2, points = 0, speed = 0, positionY = (boardHeight-boxH)/2, speedY = 0;
      setInterval(update, 50);
      box.on('click', handleBoxClick);
      $root.on('click', function(e) {
        // If the click target is not the box, show red flash
        if (!$(e.target).hasClass('box')) {
          missCount++;
          if (missCount >= 10) {
            // Flashbang effect
            $root.addClass("flashbang");
            flashbangText.show();
            flashbangAudio.currentTime = 0;
            flashbangAudio.play();
            setTimeout(function(){
              $root.removeClass("flashbang");
              flashbangText.hide();
              missCount = 0;
            }, 1500);
          } else {
            $root.addClass("red-flash");
            setTimeout(function(){ $root.removeClass("red-flash"); }, 10);
          }
        }
      });

      function moveBoxTo(newPositionX, newPositionY) {
        box.css("left", newPositionX);
        box.css("top", newPositionY);
      }
      function changeBoxText(newText) {
        box.text(newText);
      }
      function updateScoreboard(newScore) {
        scoreboard.text("Score: " + newScore);
      }
      function randomColor() {
        // Huge palette of vibrant, neon, pastel, and bold colors
        const colors = [
          "#00ff41", "#39ff14", "#00fff6", "#00bfff", "#008cff", "#4300ff", "#a500ff", "#ff00cc", "#ff0080", "#ff006e",
          "#ff3c00", "#fffc00", "#ffea00", "#ffee00", "#dfff00", "#7fff00", "#00ffea", "#00ffd0", "#00ffa9", "#00fdff",
          "#ff5e00", "#ff8c00", "#ffbb00", "#faff00", "#e1ff00", "#bfff00", "#8fff00", "#4fff00", "#00ff70", "#00ffb8",
          "#00ffd7", "#00eaff", "#0095ff", "#0055ff", "#3300ff", "#6200ff", "#9c00ff", "#bc00ff", "#e100ff", "#ff00e6",
          "#ff00b3", "#ff00a8", "#ff009e", "#ff0072", "#ff0047", "#ff002b", "#ff0000", "#ff3b3b", "#ff6363", "#ff83a8",
          "#ffb3de", "#ffc8ff", "#f6d6ff", "#e2e6ff", "#c0fff6", "#caffff", "#cfffed", "#d2ffc9", "#f0ffb3", "#fff4b3"
        ];
        return colors[Math.floor(Math.random() * colors.length)];
      }
      function animateScoreboardGlow(color) {
        scoreboard.css("--score-color", color);
        scoreboard.addClass("glow");
        setTimeout(() => scoreboard.removeClass("glow"), 400);
      }
      function update() {
        moveBoxTo(positionX, positionY)
        positionX = positionX + speed;
        positionY = positionY + speedY;
        if (positionX > boardWidth - boxW) { speed = -speed; }
        if (positionX < 0) { speed = -speed; }
        if (positionY < 0) { speedY = -speedY }
        if (positionY > boardHeight - boxH) { speedY = -speedY }
      }
      function handleBoxClick() {
        points += 1;
        speed += 2;
        speedY += 3;
        changeBoxText(points);
        updateScoreboard(points);
        animateScoreboardGlow(randomColor());
        missCount = 0; // reset miss streak on successful box click
        if (speed > 0) { speed = speed + 1 }
        if (speed < 0) { speed = speed - 1 }
        if (speedY < 0) { speedY += 1 }
        if (speedY > 0) { speedY -= 1 }
        // Animate box on click
        box.addClass('active');
        setTimeout(() => box.removeClass('active'), 150);
      }
      // Make game-root relative, box absolute
      $root.css({position:'relative',height:'100%',width:'100%',background:'#181f1a',borderRadius:'8px',margin:'0 auto'});
      box.css({position:'absolute'});
      flashbangText.hide();
      updateScoreboard(points);
      // On window resize, recalculate board size
      $(window).on('resize', () => {
        size = getBoardSize();
        boardWidth = size.width;
        boardHeight = size.height;
        boxW = box.width();
        boxH = box.height();
        positionX = Math.max(0, Math.min(positionX, boardWidth - boxW));
        positionY = Math.max(0, Math.min(positionY, boardHeight - boxH));
      });
    });
  </script>
</body>
